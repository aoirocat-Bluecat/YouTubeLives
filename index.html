<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        
        /* Stream Deck風ボタンの押し込みエフェクト */
        .deck-btn {
            box-shadow: 0 4px 0 #374151, 0 5px 10px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        .deck-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #374151, 0 1px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans selection:bg-blue-500 selection:text-white">

    <!-- ヘッダー -->
    <header class="bg-gray-800 border-b border-gray-700 py-3 px-6 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"></path><path d="m10 15 5-3-5-3z"></path></svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight">Streamer<span class="text-blue-400">Dash</span></h1>
            <span id="connectionStatus" class="ml-4 px-2.5 py-1 text-xs font-semibold rounded-full bg-gray-700 text-gray-300 flex items-center gap-1.5 border border-gray-600">
                <span class="w-1.5 h-1.5 rounded-full bg-gray-400" id="statusIndicator"></span>
                未接続
            </span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex overflow-hidden p-4 gap-4 h-[calc(100vh-65px)]">
        
        <!-- 左カラム：設定パネル -->
        <div class="w-80 flex flex-col gap-4">
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-5 flex-shrink-0">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    接続設定
                </h2>
                
                <div id="errorAlert" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500 rounded-lg text-sm text-red-200">
                    <!-- エラーメッセージがここに入ります -->
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">YouTube APIキー</label>
                        <input type="password" id="youtubeApiKey" placeholder="AIza..." class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">チャンネルID (登録者数用)</label>
                        <input type="text" id="channelId" placeholder="UC..." class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 flex justify-between">
                            <span>ライブ動画ID または URL (コメント用)</span>
                        </label>
                        <input type="text" id="videoId" placeholder="ID または https://..." class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                    </div>
                    <button id="applyBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                        適用して再接続
                    </button>
                </div>
            </div>
            
            <!-- メモ帳パネル -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 flex flex-col flex-1 min-h-0">
                <div class="p-3 border-b border-gray-700 flex justify-between items-center">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        進行メモ
                    </h2>
                    <button id="clearMemoBtn" class="text-xs text-gray-500 hover:text-gray-300">クリア</button>
                </div>
                <textarea id="scratchpad" class="flex-1 w-full bg-transparent border-none p-4 text-sm text-gray-200 resize-none focus:outline-none" placeholder="ここに自由にメモを書き込めます。&#13;&#10;ショートカットキーでの記録もここに追加されます。"></textarea>
            </div>
        </div>

        <!-- 中央カラム：統計・チャット -->
        <div class="flex-1 flex flex-col gap-4 min-w-0">
            <!-- 統計情報パネル -->
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-sm relative overflow-hidden flex-shrink-0">
                <!-- 背景アイコン装飾 -->
                <svg class="absolute -bottom-4 -right-4 w-32 h-32 text-gray-700 opacity-20 pointer-events-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                
                <div class="flex justify-between items-start">
                    <div class="grid grid-cols-2 gap-8 relative z-10 w-full">
                        <div>
                            <p class="text-sm text-gray-400 font-medium mb-1">チャンネル登録者数</p>
                            <h3 id="subscriberCount" class="text-4xl font-bold text-white tracking-tight">-</h3>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400 font-medium mb-1">配信時間</p>
                            <h3 id="streamUptime" class="text-4xl font-bold text-blue-400 tracking-tight font-mono">00:00:00</h3>
                        </div>
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t border-gray-700">
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-gray-400">現在の設定をURLとして保存・共有できます</span>
                        <button id="copyLinkBtn" class="text-xs bg-gray-700 hover:bg-gray-600 text-white py-1.5 px-3 rounded flex items-center gap-1 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                            設定URLをコピー
                        </button>
                    </div>
                </div>
            </div>

            <!-- コメントパネル -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 flex flex-col flex-1 min-h-0">
                <div class="px-5 py-3 border-b border-gray-700">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        ライブチャット
                    </h2>
                </div>
                <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <!-- チャットメッセージがここに追加されます -->
                    <div class="text-gray-500 text-sm text-center mt-10">
                        設定を入力して接続すると、ここにコメントが表示されます
                    </div>
                </div>
            </div>
        </div>

        <!-- 右カラム：ショートカットパネル -->
        <div class="w-72 flex flex-col gap-4">
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-5 flex flex-col h-full">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                    ショートカット
                </h2>
                
                <div class="grid grid-cols-2 gap-3">
                    <!-- ボタン群 -->
                    <button class="deck-btn bg-gray-700 hover:bg-gray-600 rounded-lg p-3 text-center flex flex-col items-center justify-center gap-2 text-white h-24" onclick="recordTimestamp()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <span class="text-xs font-bold">タイムスタンプ</span>
                    </button>
                    
                    <button class="deck-btn bg-gray-700 hover:bg-gray-600 rounded-lg p-3 text-center flex flex-col items-center justify-center gap-2 text-white h-24" onclick="copyToClipboard('初見さんいらっしゃい！ゆっくりしていってね。')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
                        <span class="text-xs font-bold">挨拶コピー</span>
                    </button>
                    
                    <button class="deck-btn bg-gray-700 hover:bg-gray-600 rounded-lg p-3 text-center flex flex-col items-center justify-center gap-2 text-white h-24" onclick="copyToClipboard('チャンネル登録・高評価よろしくお願いします！')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
                        <span class="text-xs font-bold">登録お願い</span>
                    </button>
                    
                    <button class="deck-btn bg-gray-700 hover:bg-gray-600 rounded-lg p-3 text-center flex flex-col items-center justify-center gap-2 text-white h-24" onclick="addMemoCheckbox()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                        <span class="text-xs font-bold">Todo追加</span>
                    </button>
                </div>
                
                <!-- カスタム用ヒント -->
                <div class="mt-auto pt-4 border-t border-gray-700 text-xs text-gray-500">
                    ※ボタンのテキストやコピー内容はHTMLコードを編集して好きな文章に変更できます。
                </div>
            </div>
        </div>
    </main>

    <script>
        // API通信用変数
        let youtubePollingInterval = null;
        let subscriberPollingInterval = null;
        let uptimeInterval = null;
        let activeLiveChatId = null;
        let nextPageToken = '';
        let isYouTubeConnected = false;

        // UI要素
        const statusIndicator = document.getElementById('statusIndicator');
        const connectionStatus = document.getElementById('connectionStatus');
        const errorAlert = document.getElementById('errorAlert');
        const chatContainer = document.getElementById('chatContainer');
        const subscriberCount = document.getElementById('subscriberCount');
        const streamUptime = document.getElementById('streamUptime');
        
        const apiKeyInput = document.getElementById('youtubeApiKey');
        const channelIdInput = document.getElementById('channelId');
        const videoIdInput = document.getElementById('videoId');
        const scratchpad = document.getElementById('scratchpad');

        // URLパラメータ処理
        function updateSettingsFromUrl() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('apiKey')) apiKeyInput.value = params.get('apiKey');
            if (params.has('channelId')) channelIdInput.value = params.get('channelId');
            if (params.has('videoId')) videoIdInput.value = params.get('videoId');
        }

        function generateShareUrl() {
            const params = new URLSearchParams();
            if (apiKeyInput.value) params.set('apiKey', apiKeyInput.value);
            if (channelIdInput.value) params.set('channelId', channelIdInput.value);
            if (videoIdInput.value) params.set('videoId', videoIdInput.value);
            
            const url = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
            return url;
        }

        // YouTube URLから動画IDを抽出する関数
        function extractVideoId(input) {
            if (!input) return '';
            // youtu.be/xxx, ?v=xxx, &v=xxx, embed/xxx などのパターンからIDを抽出
            const match = input.match(/(?:youtu\.be\/|v=|\/v\/|\/embed\/)([A-Za-z0-9_-]{11})/);
            return match ? match[1] : input.trim();
        }

        // コピー機能
        document.getElementById('copyLinkBtn').addEventListener('click', async () => {
            const url = generateShareUrl();
            await copyToClipboard(url, '設定URL');
        });

        async function copyToClipboard(text, label = 'テキスト') {
            try {
                await navigator.clipboard.writeText(text);
                showToast(`${label}をコピーしました`);
            } catch (err) {
                console.error('コピー失敗:', err);
                showToast('コピーに失敗しました', true);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-4 py-2 rounded shadow-lg text-sm transition-opacity duration-300 ${isError ? 'bg-red-600' : 'bg-green-600'} text-white z-50`;
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ショートカット機能
        function recordTimestamp() {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            scratchpad.value += `\n[${timeStr}] ★ハイライト`;
            scratchpad.scrollTop = scratchpad.scrollHeight;
            showToast('タイムスタンプをメモに記録しました');
        }

        function addMemoCheckbox() {
            scratchpad.value += `\n□ `;
            scratchpad.scrollTop = scratchpad.scrollHeight;
            scratchpad.focus();
        }

        document.getElementById('clearMemoBtn').addEventListener('click', () => {
            if (confirm('メモをクリアしますか？')) {
                scratchpad.value = '';
            }
        });

        // 配信時間（アップタイム）タイマー
        function startUptimeTimer(startTimeStr) {
            clearInterval(uptimeInterval);
            if (!startTimeStr) {
                streamUptime.innerText = "未開始";
                return;
            }
            
            const startTime = new Date(startTimeStr).getTime();
            uptimeInterval = setInterval(() => {
                const now = new Date().getTime();
                const diff = now - startTime;
                
                if (diff < 0) {
                    streamUptime.innerText = "開始前";
                    return;
                }
                
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                streamUptime.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        // APIステータスUI
        function setStatus(status, message = null) {
            errorAlert.classList.add('hidden');
            if (status === 'connected') {
                statusIndicator.className = 'w-1.5 h-1.5 rounded-full bg-green-400';
                connectionStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>接続済`;
                connectionStatus.className = 'ml-4 px-2.5 py-1 text-xs font-semibold rounded-full bg-green-900/30 text-green-400 flex items-center gap-1.5 border border-green-800';
            } else if (status === 'error') {
                statusIndicator.className = 'w-1.5 h-1.5 rounded-full bg-red-500';
                connectionStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>エラー`;
                connectionStatus.className = 'ml-4 px-2.5 py-1 text-xs font-semibold rounded-full bg-red-900/30 text-red-400 flex items-center gap-1.5 border border-red-800';
                if (message) {
                    errorAlert.innerText = message;
                    errorAlert.classList.remove('hidden');
                }
            } else {
                statusIndicator.className = 'w-1.5 h-1.5 rounded-full bg-gray-400';
                connectionStatus.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-gray-400"></span>未接続`;
                connectionStatus.className = 'ml-4 px-2.5 py-1 text-xs font-semibold rounded-full bg-gray-700 text-gray-300 flex items-center gap-1.5 border border-gray-600';
            }
        }

        // YouTube API 接続・データ取得
        async function initYouTubeConnection() {
            // 前回のポーリングをクリア
            if (youtubePollingInterval) clearInterval(youtubePollingInterval);
            if (subscriberPollingInterval) clearInterval(subscriberPollingInterval);
            if (uptimeInterval) clearInterval(uptimeInterval);
            chatContainer.innerHTML = '';
            streamUptime.innerText = '00:00:00';
            isYouTubeConnected = false;
            nextPageToken = '';

            const apiKey = apiKeyInput.value.trim();
            const channelId = channelIdInput.value.trim();
            const videoInputStr = videoIdInput.value.trim();
            
            // URLだった場合はIDを抽出
            const videoId = extractVideoId(videoInputStr);

            if (!apiKey) {
                setStatus('error', 'APIキーを入力してください。');
                return;
            }

            try {
                // 1. チャンネル登録者数の取得 (初期)
                if (channelId) {
                    await fetchSubscriberCount(channelId, apiKey);
                    subscriberPollingInterval = setInterval(() => fetchSubscriberCount(channelId, apiKey), 60000); // 1分更新
                }

                // 2. ライブチャットIDと配信開始時間の取得
                if (videoId) {
                    const videoDetails = await getLiveVideoDetails(videoId, apiKey);
                    activeLiveChatId = videoDetails.activeLiveChatId;
                    
                    // 配信開始時刻をもとにタイマー起動
                    if (videoDetails.actualStartTime) {
                        startUptimeTimer(videoDetails.actualStartTime);
                    } else {
                        streamUptime.innerText = "未開始";
                    }

                    setStatus('connected');
                    isYouTubeConnected = true;

                    // コメント初回取得＆ポーリング開始
                    await fetchLiveChat(apiKey);
                    youtubePollingInterval = setInterval(() => fetchLiveChat(apiKey), 5000); // 5秒更新
                } else {
                    setStatus('connected');
                    const msg = document.createElement('div');
                    msg.className = "text-gray-500 text-sm text-center mt-10";
                    msg.innerText = "動画ID（またはURL）が未設定のため、コメントは取得されません。";
                    chatContainer.appendChild(msg);
                }

            } catch (error) {
                console.error("YouTube connection error:", error);
                
                let errorMsg = '接続に失敗しました。';
                if (error.message.includes('403')) {
                    errorMsg = 'APIキーがブロックされました(403)。Google Cloud Consoleで「YouTube Data API v3」が有効になっているか、APIキーの制限設定を見直してください。';
                } else if (error.message.includes('400')) {
                    errorMsg = 'APIキーまたはIDの形式が不正です。不要な文字が入っていないか確認してください。';
                } else {
                    errorMsg = error.message;
                }
                
                setStatus('error', errorMsg);
            }
        }

        async function fetchSubscriberCount(channelId, apiKey) {
            const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${channelId}&key=${apiKey}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Sub fetch error: ${response.status}`);
            
            const data = await response.json();
            if (data.items && data.items.length > 0) {
                const count = data.items[0].statistics.subscriberCount;
                subscriberCount.innerText = Number(count).toLocaleString();
            }
        }

        async function getLiveVideoDetails(videoId, apiKey) {
            const url = `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${apiKey}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Video fetch HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            if (data.items && data.items.length > 0 && data.items[0].liveStreamingDetails) {
                return data.items[0].liveStreamingDetails;
            } else {
                throw new Error('指定された動画のライブ配信情報が見つかりません。ライブ中かどうか確認してください。');
            }
        }

        async function fetchLiveChat(apiKey) {
            if (!activeLiveChatId) return;

            let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${activeLiveChatId}&part=snippet,authorDetails&key=${apiKey}`;
            if (nextPageToken) {
                url += `&pageToken=${nextPageToken}`;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Live chat fetch error');
                
                const data = await response.json();
                
                // 次のページトークンを更新
                nextPageToken = data.nextPageToken;

                if (data.items && data.items.length > 0) {
                    // 初回読み込み時は過去コメントで埋まらないよう最新10件くらいに絞るなどの処理も可能
                    // 今回はシンプルに全部追加
                    data.items.forEach(item => {
                        appendChatMessage(item);
                    });
                    
                    // 自動スクロール
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (error) {
                console.error('Error fetching live chat:', error);
            }
        }

        function appendChatMessage(item) {
            const authorName = item.authorDetails.displayName;
            const authorImg = item.authorDetails.profileImageUrl;
            const message = item.snippet.displayMessage;
            const isOwner = item.authorDetails.isChatOwner;
            const isModerator = item.authorDetails.isChatModerator;
            
            let badgeHtml = '';
            if (isOwner) badgeHtml = `<span class="ml-1 px-1.5 py-0.5 bg-yellow-500/20 text-yellow-500 text-[10px] rounded border border-yellow-500/50">主</span>`;
            else if (isModerator) badgeHtml = `<span class="ml-1 px-1.5 py-0.5 bg-blue-500/20 text-blue-400 text-[10px] rounded border border-blue-500/50">モデレーター</span>`;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex gap-3 hover:bg-gray-700/50 p-2 rounded transition-colors group';
            
            msgDiv.innerHTML = `
                <img src="${authorImg}" alt="avatar" class="w-8 h-8 rounded-full border border-gray-600">
                <div class="flex-1 min-w-0">
                    <div class="flex items-baseline">
                        <span class="text-sm font-bold text-gray-300 truncate">${authorName}</span>
                        ${badgeHtml}
                    </div>
                    <div class="text-sm text-gray-100 break-words mt-0.5 leading-relaxed">${message}</div>
                </div>
            `;
            
            chatContainer.appendChild(msgDiv);
        }

        // 初期化処理
        document.getElementById('applyBtn').addEventListener('click', initYouTubeConnection);
        
        // ページ読み込み時
        window.addEventListener('DOMContentLoaded', () => {
            updateSettingsFromUrl();
            if (apiKeyInput.value) {
                // パラメータに設定があれば自動接続
                initYouTubeConnection();
            }
        });
    </script>
</body>
</html>
