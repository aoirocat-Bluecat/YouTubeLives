<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Dashboard - YouTube Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        streamer: {
                            dark: '#0f172a',    // slate-900
                            panel: '#1e293b',   // slate-800
                            accent: '#8b5cf6',  // violet-500
                            live: '#ef4444',    // red-500
                            success: '#10b981', // emerald-500
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden; 
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-message-enter {
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .pulse-live {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-70 z-40 hidden flex items-center justify-center">
        <div class="bg-streamer-panel p-6 rounded-xl border border-gray-700 w-full max-w-md shadow-2xl relative">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-gear text-streamer-accent"></i> ダッシュボード設定
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">YouTube Data API v3 Key <span class="text-red-400">*</span></label>
                    <input type="password" id="inputApiKey" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-streamer-accent" placeholder="AIzaSy...">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">YouTube Channel ID (登録者数用)</label>
                    <input type="text" id="inputChannelId" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-streamer-accent" placeholder="UC...">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">YouTube ライブ動画ID (チャット用)</label>
                    <input type="text" id="inputVideoId" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-streamer-accent" placeholder="v=以降の文字列 (例: dQw4w9WgXcQ)">
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-3">
                <button id="btnCancelSettings" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 transition">キャンセル</button>
                <button id="btnSaveSettings" class="px-4 py-2 rounded bg-streamer-accent hover:bg-violet-600 transition font-bold text-white shadow-lg">保存して接続</button>
            </div>

            <!-- URL Sharing Feature -->
            <div class="mt-6 pt-4 border-t border-gray-700">
                <h3 class="text-sm font-semibold text-gray-300 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-link"></i> 設定をURLで共有する
                </h3>
                <p class="text-xs text-gray-500 mb-3 leading-relaxed">
                    現在の入力内容を含むURLを生成します。チームメンバーに共有する際に便利です。
                </p>
                <div class="flex items-center gap-2 mb-3">
                    <input type="checkbox" id="checkShareApiKey" class="rounded bg-gray-900 border-gray-600 cursor-pointer">
                    <label for="checkShareApiKey" class="text-xs text-red-400 cursor-pointer hover:text-red-300 transition">
                        APIキーも含める（※悪用されるリスクがあるため、信頼できる相手のみ推奨）
                    </label>
                </div>
                <button id="btnCopyUrl" class="w-full px-4 py-2 rounded bg-gray-800 hover:bg-gray-700 border border-gray-600 transition text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-copy text-gray-400"></i> 共有URLをコピー
                </button>
            </div>
        </div>
    </div>

    <nav class="glass-panel px-4 py-3 flex justify-between items-center z-10 border-b border-gray-800">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-streamer-accent flex items-center justify-center shadow-lg shadow-violet-500/30">
                <i class="fa-brands fa-youtube text-white"></i>
            </div>
            <h1 class="font-bold text-lg tracking-wide">Streamer<span class="text-streamer-accent">Dash</span></h1>
            <div id="connectionStatus" class="ml-4 px-3 py-1 rounded-full text-xs font-semibold bg-gray-700/50 text-gray-300 flex items-center gap-2 border border-gray-600">
                <span class="w-2 h-2 rounded-full bg-gray-400 inline-block" id="statusDot"></span>
                <span id="statusText">未接続</span>
            </div>
        </div>
        <div>
            <button id="btnOpenSettings" class="text-gray-300 hover:text-white transition px-4 py-2 bg-gray-800 rounded-lg border border-gray-700 hover:border-gray-500 shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> <span class="hidden sm:inline">設定</span>
            </button>
        </div>
    </nav>

    <!-- AIを消したため 4カラム -> 3カラム (lg:grid-cols-3) に変更 -->
    <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-3 gap-4 overflow-hidden">
        
        <!-- Left Column: Stats & Tools (Col span 1) -->
        <div class="col-span-1 flex flex-col gap-4 overflow-y-auto pr-1">
            
            <!-- Real-time Subscriber Counter -->
            <div class="glass-panel rounded-xl p-5 border border-gray-700 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition duration-500">
                    <i class="fa-solid fa-users text-7xl"></i>
                </div>
                <h3 class="text-gray-400 text-sm font-semibold mb-1 uppercase tracking-wider">チャンネル登録者数</h3>
                <div class="flex items-end gap-2">
                    <span id="subCountDisplay" class="text-5xl font-bold text-white tracking-tighter">---</span>
                    <span class="text-gray-500 font-medium mb-1">人</span>
                </div>
            </div>

            <!-- Stream Timer -->
            <div class="glass-panel rounded-xl p-5 border border-gray-700">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider">配信時間 (Uptime)</h3>
                    <div id="liveIndicator" class="w-3 h-3 rounded-full bg-red-500 pulse-live hidden"></div>
                </div>
                <div id="timerDisplay" class="text-4xl font-bold text-white text-center tracking-widest font-mono mb-4 bg-gray-900/50 rounded py-2">
                    00:00:00
                </div>
                <div class="flex justify-center gap-2">
                    <button id="btnStartTimer" class="flex-1 bg-green-600/90 hover:bg-green-500 text-white py-2 rounded font-semibold transition border border-green-700 shadow-lg">
                        <i class="fa-solid fa-play mr-1"></i> 開始
                    </button>
                    <button id="btnStopTimer" class="flex-1 bg-red-600/90 hover:bg-red-500 text-white py-2 rounded font-semibold transition border border-red-700 shadow-lg hidden">
                        <i class="fa-solid fa-stop mr-1"></i> 終了
                    </button>
                    <button id="btnResetTimer" class="px-4 bg-gray-700 hover:bg-gray-600 text-white py-2 rounded transition border border-gray-600" title="リセット">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Audio Visualizer -->
            <div class="glass-panel rounded-xl p-5 border border-gray-700 flex-1 flex flex-col min-h-[200px]">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider">マイク入力レベル</h3>
                    <button id="btnStartAudio" class="text-xs bg-streamer-accent hover:bg-violet-600 px-3 py-1.5 rounded transition text-white shadow-md">
                        <i class="fa-solid fa-microphone"></i> 接続
                    </button>
                </div>
                <div class="flex-1 bg-gray-900 rounded-lg border border-gray-800 relative overflow-hidden flex items-center justify-center">
                    <canvas id="audioCanvas" class="absolute inset-0 w-full h-full"></canvas>
                    <div id="audioOverlay" class="text-gray-500 text-xs z-10 pointer-events-none flex flex-col items-center gap-2">
                        <i class="fa-solid fa-microphone-lines-slash text-2xl opacity-50"></i>
                        <span>マイクを接続してください</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Middle & Right Column: Live Comment Viewer (Col span 2) -->
        <div class="col-span-1 lg:col-span-2 glass-panel rounded-xl border border-gray-700 flex flex-col overflow-hidden relative shadow-2xl">
            <div class="p-3 border-b border-gray-700 bg-gray-800 flex justify-between items-center">
                <h2 class="font-bold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-comments text-blue-400"></i> ライブコメント
                </h2>
                <div class="flex gap-2">
                    <button id="btnAutoScroll" class="text-xs px-3 py-1.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/50 hover:bg-blue-500/40 transition flex items-center gap-1">
                        <i class="fa-solid fa-arrow-down-up-across-line"></i> 自動スクロール: ON
                    </button>
                </div>
            </div>
            
            <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#111827]">
                <div class="text-center text-gray-500 text-sm py-20 flex flex-col items-center gap-4" id="chatPlaceholder">
                    <i class="fa-brands fa-youtube text-6xl opacity-30 block"></i>
                    <p>右上の「設定」からAPIキーと動画IDを入力して<br>チャットに接続してください</p>
                </div>
            </div>
            
            <button id="btnScrollToBottom" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-blue-600/90 text-white px-4 py-2 rounded-full shadow-lg hidden hover:bg-blue-500 transition z-10 flex items-center gap-2 backdrop-blur-sm border border-blue-400/30">
                <i class="fa-solid fa-arrow-down"></i> 最新のコメントを見る
            </button>
        </div>

    </main>

    <script>
        const state = {
            apiKey: '',
            channelId: '',
            videoId: '',
            liveChatId: '',
            
            isTimerRunning: false,
            timerStartTime: 0,
            timerInterval: null,
            timerElapsedTime: 0,
            
            isChatPolling: false,
            chatNextPageToken: '',
            chatPollingInterval: null,
            chatDelayMillis: 5000, 
            
            isSubPolling: false,
            subPollingInterval: null,
            
            autoScroll: true,
            
            audioContext: null,
            analyser: null,
            micStream: null,
            animationFrameId: null
        };

        const els = {
            toastContainer: document.getElementById('toastContainer'),
            settingsModal: document.getElementById('settingsModal'),
            inputApiKey: document.getElementById('inputApiKey'),
            inputChannelId: document.getElementById('inputChannelId'),
            inputVideoId: document.getElementById('inputVideoId'),
            checkShareApiKey: document.getElementById('checkShareApiKey'),
            btnCopyUrl: document.getElementById('btnCopyUrl'),
            
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            
            subCountDisplay: document.getElementById('subCountDisplay'),
            
            timerDisplay: document.getElementById('timerDisplay'),
            btnStartTimer: document.getElementById('btnStartTimer'),
            btnStopTimer: document.getElementById('btnStopTimer'),
            btnResetTimer: document.getElementById('btnResetTimer'),
            liveIndicator: document.getElementById('liveIndicator'),
            
            chatContainer: document.getElementById('chatContainer'),
            chatPlaceholder: document.getElementById('chatPlaceholder'),
            btnAutoScroll: document.getElementById('btnAutoScroll'),
            btnScrollToBottom: document.getElementById('btnScrollToBottom'),
            
            btnStartAudio: document.getElementById('btnStartAudio'),
            audioCanvas: document.getElementById('audioCanvas'),
            audioOverlay: document.getElementById('audioOverlay'),
        };

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            let bgColor, icon;
            switch(type) {
                case 'success': bgColor = 'bg-green-600'; icon = 'fa-check-circle'; break;
                case 'error': bgColor = 'bg-red-600'; icon = 'fa-triangle-exclamation'; break;
                case 'warning': bgColor = 'bg-yellow-600'; icon = 'fa-circle-exclamation'; break;
                default: bgColor = 'bg-blue-600'; icon = 'fa-info-circle'; break;
            }
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-x-full opacity-0 max-w-sm pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;
            
            els.toastContainer.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-x-full', 'opacity-0'));
            
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function parseUrlParams() {
            const params = new URLSearchParams(window.location.search);
            let hasParams = false;

            if (params.has('apiKey')) {
                state.apiKey = params.get('apiKey');
                els.inputApiKey.value = state.apiKey;
                hasParams = true;
            }
            if (params.has('channelId')) {
                state.channelId = params.get('channelId');
                els.inputChannelId.value = state.channelId;
                hasParams = true;
            }
            if (params.has('videoId')) {
                state.videoId = params.get('videoId');
                els.inputVideoId.value = state.videoId;
                hasParams = true;
            }
            return hasParams;
        }

        function loadSettings() {
            // Priority: URL Params > LocalStorage
            const hasUrlParams = parseUrlParams();

            if (!hasUrlParams) {
                state.apiKey = localStorage.getItem('ytApiKey') || '';
                state.channelId = localStorage.getItem('ytChannelId') || '';
                state.videoId = localStorage.getItem('ytVideoId') || '';
                
                els.inputApiKey.value = state.apiKey;
                els.inputChannelId.value = state.channelId;
                els.inputVideoId.value = state.videoId;
            } else {
                // If URL params existed, save them to local storage immediately
                localStorage.setItem('ytApiKey', state.apiKey);
                localStorage.setItem('ytChannelId', state.channelId);
                localStorage.setItem('ytVideoId', state.videoId);
                
                // Clear URL to keep it clean after reading
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        document.getElementById('btnSaveSettings').addEventListener('click', async () => {
            state.apiKey = els.inputApiKey.value.trim();
            state.channelId = els.inputChannelId.value.trim();
            state.videoId = els.inputVideoId.value.trim();
            
            localStorage.setItem('ytApiKey', state.apiKey);
            localStorage.setItem('ytChannelId', state.channelId);
            localStorage.setItem('ytVideoId', state.videoId);
            
            els.settingsModal.classList.add('hidden');
            showToast('設定を保存しました', 'success');
            
            await initYouTubeConnection();
        });

        document.getElementById('btnOpenSettings').addEventListener('click', () => els.settingsModal.classList.remove('hidden'));
        document.getElementById('btnCancelSettings').addEventListener('click', () => els.settingsModal.classList.add('hidden'));

        els.btnCopyUrl.addEventListener('click', () => {
            // Get current inputs directly from DOM
            const cId = els.inputChannelId.value.trim();
            const vId = els.inputVideoId.value.trim();
            const aKey = els.inputApiKey.value.trim();
            const includeKey = els.checkShareApiKey.checked;

            if (!cId && !vId && (!includeKey || !aKey)) {
                showToast('共有する設定が入力されていません', 'warning');
                return;
            }

            const url = new URL(window.location.href);
            url.search = ''; // Clear existing params
            
            if (cId) url.searchParams.set('channelId', cId);
            if (vId) url.searchParams.set('videoId', vId);
            if (includeKey && aKey) url.searchParams.set('apiKey', aKey);

            const shareUrl = url.toString();

            try {
                // Compatible copy method for iframes/older browsers
                const textArea = document.createElement("textarea");
                textArea.value = shareUrl;
                textArea.style.position = "fixed"; 
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.select();
                const successful = document.execCommand("copy");
                textArea.remove();

                if (successful) {
                    showToast('共有URLをコピーしました！', 'success');
                } else {
                    throw new Error('Copy command failed');
                }
            } catch (err) {
                console.error('Fallback copy failed:', err);
                showToast('コピーに失敗しました。', 'error');
            }
        });


        function updateConnectionStatus(isConnected, message) {
            if (isConnected) {
                els.statusDot.className = 'w-2 h-2 rounded-full inline-block bg-streamer-success pulse-live';
                els.statusText.textContent = message || '接続済み';
            } else {
                els.statusDot.className = 'w-2 h-2 rounded-full inline-block bg-gray-400';
                els.statusText.textContent = message || '未接続';
            }
        }

        async function initYouTubeConnection() {
            if (!state.apiKey) {
                showToast('APIキーが設定されていません', 'warning');
                return;
            }

            stopYouTubePolling();
            updateConnectionStatus(true, '接続試行中...');

            let hasError = false;

            if (state.channelId) {
                try {
                    await fetchSubscriberCount();
                    startSubPolling();
                } catch (e) {
                    showToast('登録者数の取得に失敗しました', 'error');
                    console.error(e);
                    hasError = true;
                }
            }

            if (state.videoId) {
                try {
                    const chatId = await getLiveChatId(state.videoId);
                    if (chatId) {
                        state.liveChatId = chatId;
                        els.chatPlaceholder.style.display = 'none';
                        els.chatContainer.innerHTML = ''; 
                        await fetchLiveChat(); 
                        startChatPolling();
                    } else {
                        throw new Error("Live chat ID not found for this video.");
                    }
                } catch (e) {
                    showToast('チャットへの接続に失敗しました', 'error');
                    console.error(e);
                    hasError = true;
                }
            }

            if (!hasError && (state.channelId || state.videoId)) {
                updateConnectionStatus(true, 'オンライン');
                showToast('YouTubeに接続しました', 'success');
            } else if (!state.channelId && !state.videoId) {
                updateConnectionStatus(false, '待機中');
            } else {
                updateConnectionStatus(false, 'エラー発生');
            }
        }

        async function fetchSubscriberCount() {
            const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${state.channelId}&key=${state.apiKey}`;
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.items && data.items.length > 0) {
                const subCount = data.items[0].statistics.subscriberCount;
                els.subCountDisplay.textContent = parseInt(subCount).toLocaleString();
            }
        }

        async function getLiveChatId(videoId) {
            const url = `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${state.apiKey}`;
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.items && data.items.length > 0) {
                return data.items[0].liveStreamingDetails?.activeLiveChatId || null;
            }
            return null;
        }

        async function fetchLiveChat() {
            let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${state.liveChatId}&part=snippet,authorDetails&key=${state.apiKey}`;
            if (state.chatNextPageToken) {
                url += `&pageToken=${state.chatNextPageToken}`;
            }

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();
                
                state.chatNextPageToken = data.nextPageToken || state.chatNextPageToken;
                state.chatDelayMillis = data.pollingIntervalMillis || 5000;

                if (data.items && data.items.length > 0) {
                    data.items.forEach(item => {
                        appendChatMessage(item);
                    });
                }
            } catch (error) {
                console.error("Chat polling error:", error);
            }
        }

        function appendChatMessage(item) {
            const author = item.authorDetails.displayName;
            const profileImageUrl = item.authorDetails.profileImageUrl;
            const message = item.snippet.displayMessage;
            const isSuperChat = item.snippet.type === 'superChatEvent';
            const isModerator = item.authorDetails.isChatModerator;

            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message-enter p-3 rounded-lg border flex gap-3 ${isSuperChat ? 'bg-orange-500/20 border-orange-500 text-orange-100' : 'bg-gray-800 border-gray-700'}`;
            
            const escapeHtml = (unsafe) => {
                return (unsafe||'').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            };
            const escapedMsg = escapeHtml(message);

            msgDiv.innerHTML = `
                <img src="${profileImageUrl}" alt="${author}" class="w-8 h-8 rounded-full mt-1 border border-gray-600" onerror="this.src='https://placehold.co/32x32/1e293b/8b5cf6?text=U'">
                <div class="flex-1">
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-bold ${isModerator ? 'text-blue-400' : 'text-gray-400'}">
                            ${isModerator ? '<i class="fa-solid fa-wrench mr-1"></i> ' : ''}${escapeHtml(author)}
                        </span>
                    </div>
                    <div class="text-sm mt-1 leading-snug break-all text-gray-200">${escapedMsg}</div>
                </div>
            `;
            
            els.chatContainer.appendChild(msgDiv);

            if (state.autoScroll) {
                els.chatContainer.scrollTop = els.chatContainer.scrollHeight;
            }
        }

        els.chatContainer.addEventListener('scroll', () => {
            const isAtBottom = els.chatContainer.scrollHeight - els.chatContainer.scrollTop <= els.chatContainer.clientHeight + 50;
            if (isAtBottom) {
                state.autoScroll = true;
                els.btnScrollToBottom.classList.add('hidden');
                updateAutoScrollBtn();
            } else if (state.autoScroll) {
                state.autoScroll = false;
                els.btnScrollToBottom.classList.remove('hidden');
                updateAutoScrollBtn();
            }
        });

        els.btnScrollToBottom.addEventListener('click', () => {
            state.autoScroll = true;
            els.chatContainer.scrollTop = els.chatContainer.scrollHeight;
            els.btnScrollToBottom.classList.add('hidden');
            updateAutoScrollBtn();
        });

        els.btnAutoScroll.addEventListener('click', () => {
            state.autoScroll = !state.autoScroll;
            if (state.autoScroll) els.chatContainer.scrollTop = els.chatContainer.scrollHeight;
            updateAutoScrollBtn();
        });

        function updateAutoScrollBtn() {
            if (state.autoScroll) {
                els.btnAutoScroll.innerHTML = '<i class="fa-solid fa-arrow-down-up-across-line"></i> 自動スクロール: ON';
                els.btnAutoScroll.className = 'text-xs px-3 py-1.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/50 hover:bg-blue-500/40 transition flex items-center gap-1';
            } else {
                els.btnAutoScroll.innerHTML = '<i class="fa-solid fa-arrow-down-up-across-line"></i> 自動スクロール: OFF';
                els.btnAutoScroll.className = 'text-xs px-3 py-1.5 rounded bg-gray-700 text-gray-400 border border-gray-600 hover:bg-gray-600 transition flex items-center gap-1';
            }
        }

        function startSubPolling() {
            if (state.subPollingInterval) clearInterval(state.subPollingInterval);
            state.subPollingInterval = setInterval(fetchSubscriberCount, 10000); 
        }

        function startChatPolling() {
            if (state.chatPollingInterval) clearTimeout(state.chatPollingInterval);
            const poll = async () => {
                if (state.liveChatId) {
                    await fetchLiveChat();
                }
                state.chatPollingInterval = setTimeout(poll, state.chatDelayMillis);
            };
            state.chatPollingInterval = setTimeout(poll, state.chatDelayMillis);
        }

        function stopYouTubePolling() {
            if (state.subPollingInterval) clearInterval(state.subPollingInterval);
            if (state.chatPollingInterval) clearTimeout(state.chatPollingInterval);
            state.subPollingInterval = null;
            state.chatPollingInterval = null;
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function updateTimerDisplay() {
            els.timerDisplay.textContent = formatTime(state.timerElapsedTime);
        }

        els.btnStartTimer.addEventListener('click', () => {
            if (state.isTimerRunning) return;
            state.isTimerRunning = true;
            state.timerStartTime = Date.now() - (state.timerElapsedTime * 1000);
            
            els.btnStartTimer.classList.add('hidden');
            els.btnStopTimer.classList.remove('hidden');
            els.liveIndicator.classList.remove('hidden');
            
            state.timerInterval = setInterval(() => {
                state.timerElapsedTime = Math.floor((Date.now() - state.timerStartTime) / 1000);
                updateTimerDisplay();
            }, 1000);
        });

        els.btnStopTimer.addEventListener('click', () => {
            state.isTimerRunning = false;
            clearInterval(state.timerInterval);
            
            els.btnStopTimer.classList.add('hidden');
            els.btnStartTimer.classList.remove('hidden');
            els.liveIndicator.classList.add('hidden');
        });

        els.btnResetTimer.addEventListener('click', () => {
            state.isTimerRunning = false;
            clearInterval(state.timerInterval);
            state.timerElapsedTime = 0;
            updateTimerDisplay();
            
            els.btnStopTimer.classList.add('hidden');
            els.btnStartTimer.classList.remove('hidden');
            els.liveIndicator.classList.add('hidden');
        });

        // Audio Visualizer
        els.btnStartAudio.addEventListener('click', async () => {
            if (state.audioContext) {
                cancelAnimationFrame(state.animationFrameId);
                if(state.micStream) state.micStream.getTracks().forEach(track => track.stop());
                state.audioContext.close();
                state.audioContext = null;
                
                els.btnStartAudio.innerHTML = '<i class="fa-solid fa-microphone"></i> 接続';
                els.btnStartAudio.className = 'text-xs bg-streamer-accent hover:bg-violet-600 px-3 py-1.5 rounded transition text-white shadow-md';
                els.audioOverlay.style.display = 'flex';
                
                const ctx = els.audioCanvas.getContext('2d');
                ctx.clearRect(0, 0, els.audioCanvas.width, els.audioCanvas.height);
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                state.micStream = stream;
                
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                state.audioContext = new AudioContext();
                
                const source = state.audioContext.createMediaStreamSource(stream);
                state.analyser = state.audioContext.createAnalyser();
                
                state.analyser.fftSize = 256;
                const bufferLength = state.analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                source.connect(state.analyser);
                
                els.btnStartAudio.innerHTML = '<i class="fa-solid fa-microphone-slash"></i> 切断';
                els.btnStartAudio.className = 'text-xs bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded transition text-white shadow-md';
                els.audioOverlay.style.display = 'none';

                const ctx = els.audioCanvas.getContext('2d');
                const resizeCanvas = () => {
                    const rect = els.audioCanvas.parentElement.getBoundingClientRect();
                    els.audioCanvas.width = rect.width;
                    els.audioCanvas.height = rect.height;
                };
                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                const draw = () => {
                    if (!state.audioContext) return;
                    state.animationFrameId = requestAnimationFrame(draw);
                    
                    state.analyser.getByteFrequencyData(dataArray);
                    
                    ctx.fillStyle = 'rgb(17, 24, 39)'; 
                    ctx.fillRect(0, 0, els.audioCanvas.width, els.audioCanvas.height);
                    
                    const barWidth = (els.audioCanvas.width / bufferLength) * 2.5;
                    let barHeight;
                    let x = 0;
                    
                    for (let i = 0; i < bufferLength; i++) {
                        barHeight = dataArray[i];
                        
                        const gradient = ctx.createLinearGradient(0, els.audioCanvas.height, 0, 0);
                        gradient.addColorStop(0, '#8b5cf6');
                        gradient.addColorStop(1, '#3b82f6'); 
                        
                        ctx.fillStyle = gradient;
                        const displayHeight = (barHeight / 255) * els.audioCanvas.height;
                        
                        ctx.fillRect(x, els.audioCanvas.height - displayHeight, barWidth, displayHeight);
                        x += barWidth + 1;
                    }
                };
                
                draw();
                showToast('マイクに接続しました', 'success');
                
            } catch (err) {
                console.error('Error accessing microphone:', err);
                showToast('マイクのアクセスが拒否されたか、エラーが発生しました', 'error');
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            
            if (state.apiKey && (state.channelId || state.videoId)) {
                initYouTubeConnection();
            } else {
                els.settingsModal.classList.remove('hidden');
            }
        });

    </script>
</body>
</html>
